name: Build Coordinator

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build with csc
        run: |
          $csc = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\MSBuild\Current\Bin\Roslyn\csc.exe"
          if (-not (Test-Path $csc)) {
              $csc = "C:\Program Files\Microsoft Visual Studio\2022\Community\MSBuild\Current\Bin\Roslyn\csc.exe"
          }
          New-Item -ItemType Directory -Force -Path bin
          & $csc /target:exe /out:bin\AtlasCoordinatorService.exe /r:System.ServiceModel.dll /r:System.Web.Extensions.dll AtlasCoordinatorService.cs
        shell: powershell
